[project]
name = "local-voice"
version = "1.1.1"
description = "Read selected text aloud using a local TTS engine."
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "kokoro>=0.9",
    "numpy",
    "pyyaml>=6.0",
    "piper-tts>=1.7.0",
    "torch==2.11.0+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
local-voice = "service.app:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
