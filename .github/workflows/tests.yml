name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.26"
      # Unit tests mock engine loading. Do not install the project dependency set:
      # it includes the optional en_core_web_sm speech model wheel.
      - name: Install test dependencies without optional speech models
        run: |
          uv venv --python 3.12 .ci-venv
          uv pip install --python .ci-venv/bin/python \
            fastapi==0.135.3 pydantic==2.12.5 pyyaml==6.0.3 piper-tts==1.7.0
      - name: Run Python unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: .ci-venv/bin/python -m unittest discover -s tests -v

  rust:
    name: Rust library tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev
      # Tauri's build script checks resource paths even for cargo test --lib.
      # This placeholder is not a bundled runtime or release artifact.
      - name: Prepare required Tauri resource path for library tests
        run: |
          mkdir -p .bundle-venv
          touch .bundle-venv/.ci-placeholder
      - name: Run Rust library tests
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml
